# EVO-024（ARCH-004 设计 §5.3 D3(c) 第①步 / RISK-001 主轨道）：门控单入口 CI。
#
# 职责：把仓库门控命令 `node tests/run-all.mjs`（tests/*.mjs 全量网，顺序执行 +
# 退出码聚合）挂到 GitHub Actions 单 job——契约快照/声明面/消费点守卫/白名单/
# 域行为判别全部随每次 push 复跑（RISK-003 宿主漂移预警的仓库侧时点）。
#
# 边界（如实标注，避免「CI 绿 = 真机可用」的误读）：
# - **本 workflow 能覆盖**：可在 Node 内静态或桩驱动执行的套件——宿主面契约
#   快照与声明面比对（tests/host-contract.mjs）、宿主版本基线快照、消费点黑名单、
#   转发事件白名单、域行为判别（host-abi-health / fix-029 / preset-defaults /
#   oauth-* / client-render / smoke 等）；本地与 CI 跑的是同一条门控命令
#   `node tests/run-all.mjs`（启动行区分「N 独立套件 + M runner 模块」——
#   4 个 runner 模块（attachments / audit-001-concurrency / client-render /
#   install-entry）只 export runX、断言由 smoke.mjs 承载，run-all 会机器断言其调用点在场；
#   双向守卫：未排除的套件反向断言「含独立入口/退出闸」——漏登记即红（FIX-037 ②）；
#   套件内 skip 行由 run-all 回显（FIX-037 ①，见下条）。
# - **在 ubuntu-latest 上会 skip 的断言**（打印可见 skip、不失败——禁静默降级）：
#   门控入口对通过套件默认只打一行摘要，故 `run-all.mjs` 捕获各套件输出中的 skip 行
#   并回显（FIX-037 ①）——`PASS <suite> (Nms, K skip)` + `#SKIP | <原行>` 逐行列出，
#   汇总行附 `#SKIP n (套件×条数)`；CI 日志由此可判定「哪些断言被跳过」（此前 skip 行
#   被 `stdio: pipe` 吞掉 → 声明与实际互斥）：
#   1) tests/host-contract.mjs：S3「宿主侧包表半边」（inject 三 client 包 vs 宿主
#      `@deepseek-ai` 实际包表）与 S7 增强靶子组需要宿主 checkout——CI 无
#      DSH_HOST_SOURCE、无 LOCALAPPDATA/_npx → 记 `--  skipped`（经上述 `#SKIP` 回显）；
#      其余 71 条静态断言照跑（宿主不可达侧；宿主可达侧 82 条——FIX-037 R1；宿主面基线
#      为静态常量，不依赖宿主——BR-03）；宿主靶子可达时另打印关键包版本一致性判据
#      （FIX-037 ③：≠ HOST_BASELINE → 显式告警 + skip）；
#   2) tests/smoke.mjs：install.ps1 解析断言先探测 powershell/pwsh（两者皆无则打印
#      skip 原因后跳过，不再硬编码 powershell → ENOENT 假红）。Ubuntu 运行器预期自带
#      PowerShell 7（pwsh）→ 该断言经 pwsh 臂执行；**该平台事实以 CI 首跑日志确认**
#      （FIX-037 ① 起探针结果可见——单宿主探针失败亦打印 `skip … (probe failed: …)`，
#      该臂不静默消失）；若运行器无 pwsh，则该断言打印可见 skip（非静默通过）。
#      **FIX-038 新增 skip 来源（平台适用性判据；CI 首跑 run 34696694673 实证驱动）**：
#      ① smoke 的 `cli invocation cmd shim` 1 条——**FIX-040 P2-2 起该条已平台中立化，
#      不再是 skip 来源**：`resolveCliInvocation(command, args, platform = 实机平台)`
#      增可选平台判据注入点（与同文件 resolveCliSpec 同形；默认实机 ⇒ 行为零变化），
#      断言显式传 'win32' 驱动 → 全平台恒跑（含新增反向臂：注入 'linux' 断言该分支被
#      正确旁路）；平台中立的 `wrapCmdLine passthrough` 照跑；② install-entry 的 `-File`
#      离线臂 3 条——`offline install (-File)
#      succeeds/idempotent`、`bare-source install (-File) creates dep link / plugin resolves
#      / idempotent`、`real node_modules dir left untouched (-File)`：install.ps1 自述为
#      Windows 专属入口（install.ps1:1「Windows / PowerShell 5.1+」），其离线臂依赖
#      junction / robocopy 拷贝回退 / 反斜杠子路径（'profiles\node_modules'），非 win32
#      不可判定（首跑实证该臂失败 + 裸源码臂于 `lstatSync` ENOENT 裸抛致套件崩溃、其后
#      断言与诊断全部丢失）；**POSIX 对偶覆盖按臂分列（仅陈述实际成立范围）**：§6（`-File`
#      离线安装）与 §6c（裸源码依赖链接）在 sh 可用时由 install.sh 臂承担（见下条；sh 缺失
#      时另有 `POSIX online checks` skip 行可辨）；**§6d（自带真实
#      `node_modules` 不得改动）无 POSIX 对照臂**——install.sh 的「源码自带依赖目录：…
#      （跳过依赖链接）」分支与 `LINKED=0` 拷贝回退护栏（「只移除本脚本创建的符号链接
#      （绝不对真实目录 rm -rf）」）明载同一数据保护语义却零判别测试，属已知覆盖缺口
#      （台账候选 · R0 P2-1-A 如实标注，不声称对称）。**锚形 = 符号名 / 代码串 + 文件**
#      （FIX-040：install.sh 行号锚属实测漂移族，不再写死行号）。
#      **预期内的 skip（非缺陷，FIX-037 P2-3/R1 口径 + FIX-038 扩表 + FIX-040 收口，按环境分列）**：
#      ubuntu 正常态 = `#SKIP 6 (host-contract.mjs×2, smoke.mjs×4)`（**预期值——修复后首跑
#      前尚未实测，以首跑日志逐行复核**）——host-contract 在 CI
#      必然无宿主（见上条）⇒ S3 半边 + S7 组 2 条；smoke 4 条 = `install.ps1 parses
#      (powershell)` 探针臂 1（`tests/smoke.mjs` 探针循环：ubuntu 仅有 pwsh，`powershell`
#      探针 ENOENT 打印 `skip install.ps1 parses (powershell) (probe failed: ENOENT)`；同一
#      断言由 pwsh 臂完整执行，≠ 断言被跳过）+ FIX-038 遗留来源 3 条（`-File` 离线臂：
#      offline install succeeds/idempotent 1 + bare-source 1 + 真实 node_modules 1——
#      `!PS1_OFFLINE_APPLICABLE` 触发）。**不计入 ubuntu 的 Windows 侧来源**：`POSIX online
#      checks`（其触发条件 = `posixShell()` 返回 null，即 `sh` 或 `curl` 均不可探——
#      ubuntu 运行器自带 sh+curl ⇒ 该臂照跑不跳，实测本机 win32 的该 skip 即由此来）、
#      win32 侧 `0o600` 可见 skip（ubuntu 照常执行）；`.cmd` shim 臂已由 FIX-040 P2-2
#      平台中立化（全平台恒跑），亦不计入。
#      **Windows 本地正常态 = `#SKIP 2 (smoke.mjs×2)`（本地实测，FIX-040 起由 1 升为 2；
#      install-entry 的 `POSIX online checks` 1 条 + smoke 的 `0o600` 可见 skip 1 条——后者
#      FIX-040 前为 `if (!win32)` 静默消失，属 FIX-037 ① 同族收口）**。
#      判据取**相对基线增量**：新增 skip 来源或断言数下降才需研判（绝对值随平台
#      组合变化，不作告警依据）；
#   3) tests/install-entry.mjs：在线/离线命令臂按可用宿主择一——POSIX sh+curl 臂在
#      ubuntu 执行，PowerShell 臂走 pwsh（7.x）；**Windows PowerShell 5.1 臂在本平台
#      不存在**（自动降级为 7.x 臂，不失败）。**FIX-038 平台适用性补齐**：`-File` 离线
#      安装臂（§6 / §6c / §6d）MUST 在 win32 执行——非 win32 打印可见 skip（原因见上条
#      ②），即首跑 failure 的修复面；在线命令臂（pwsh `-Command`）与 git 失败中止臂
#      （断言失败路径，不涉链接语义）跨平台照跑，不因平台判据被截断。
# - **必须 Windows 本地跑（本 job 不覆盖）**：Windows PowerShell 5.1 解析/执行臂
#   （install.ps1 5.1 + install-entry 的 5.1 online/offline 命令）、**目录 link 语义的
#   win32 半边**（win32 走 junction——FIX-038 起 install.ps1 的 `-File` 离线安装臂按
#   此判据平台门控：非 win32 记可见 skip，不再以失败/崩溃形态出现）、宿主运行时装配
#   （真实 DSH runner / fiber
#   inject 面就绪时序）、GUI 渲染与设置页交互、OAuth 真实端点与登录流、CLI 子代理
#   真机执行——由真机手工验收 + `router/hostFaceDiagnostics` 诊断面板（宿主版本 +
#   面健康 + 诊断环形）兜底。**按臂分列（FIX-040 如实化，仅陈述实际成立范围）**：目录
#   link 语义的 **POSIX 半边（symlink）实为 CI 已覆盖**——`sh` 可用时 install-entry 的
#   `sh --local` 臂在 ubuntu 首跑日志中已执行（run 34696694673：该臂已跑，失败点在
#   其后 §6c 的 `lstatSync` 裸抛）；CI 不覆盖的是 **win32 junction 半边**与
#   §6d 对偶臂（见上条）。对称面：smoke 的 POSIX 文件权限断言（0o600）仅在非 win32
#   平台执行（FIX-040 起 win32 侧为**可见 skip**，非静默消失）。
# - **宿主依赖解析（本步骤的已知边界）**：插件与宿主的宿主面交互全部经 cordis
#   服务注入（ctx.get / ctx.remote.* / dsh.client.inject），lib/ 内**无任何**
#   peerDependencies 包的直接 import（peerDeps 8 项仅为记录性声明，消费面为
#   ctx 服务）；lib/ 直接 import 的宿主包 = dependencies（dsh-llm / dsh-tools /
#   dsh-typert-protocol）+ cordis / schemastery，均在公开 registry 可解析
#   （0.1.5-rc.2 实测基线）——**「公开 registry 可解析」属远端事实，待 CI 首跑确认**
#   （本地等价命令已实证；首跑失败即按本步骤边界处置，不得静默降级）。故
#   `pnpm install --frozen-lockfile` 即可满足全部套件（lockfile 已含 autoInstallPeers
#   解析的 peer 记录）；若未来新增对宿主 checkout 的硬依赖，须在本步骤显式锁版本
#   安装宿主基线（0.1.5-rc.2）或标注为后续步骤——不得让门控静默降级。
# - 首跑属 push 后动作（本批次只落结构 + 本地等价命令实证，不触发远端 CI）。
#
# guard-matrix（ARCH-005 R3——看护矩阵化，设计 §6 R3 行 / §2-B 四维-c）：
# - 双基线矩阵门控——每基线一 job，跑与 guard job **同一条门控命令**
#   `node tests/run-all.mjs`；基线选择经 `DSH_BASELINE` 环境变量（两测试套件按 R3 机制
#   消费：靶子面判据按所选基线档案项判定，声明面恒判 primary）。
# - pinned 宿主安装（供应链纪律 = 精确版本 pin + registry 拉取）：npm pack
#   HOST_KEY_PACKAGES（dsh 主包 + 7 个 dsh-* 判据包）到 job 环境（$RUNNER_TEMP）+
#   `DSH_HOST_SOURCE` 指向 → host-contract 的 S3 宿主侧半边 / S7 增强组在 CI
#   不再 skip（guard job 无宿主树，两面恒 skip——R3 目标由本 job 承载）。
# - **版本单源（P5）**：matrix 的基线 id 列表与各 job 的 pinned 版本**不写 yaml 字面量**
#   ——一律由 `tests/host-version-snapshot.mjs` 的 HOST_BASELINE_REGISTRY 运行时解析
#   （resolve-baselines job 产出 id 集 → matrix 消费；guard-matrix 内每 job 再按
#   DSH_BASELINE 解析 dsh / dshPackages 两值）。
# - **树形态 = 恰好 HOST_KEY_PACKAGES 8 包**（刻意不含 dsh-typert-registry /
#   dsh-settings）：rpc-shadow-guard §6 与 settings-config-migration §3 的真树判据是
#   0.2.0 专属**行为**断言（A2/A3 批：validateCodec create() 强制 / settings Config
#   volatile 面），对 0.1.5 树必然红且不可按 DSH_BASELINE 分代（其判据面无 since 档案）
#   ——缺包时两者按既有 BR-03 可见 skip 语义降级（与 guard job 无宿主树时同行为，
#   判据面不丢失，仅不在矩阵 job 内重复承载）。
# - 预期 skip 形态（判据取**相对 guard job 增量**，绝对值随平台组合变化）：
#   primary job = guard 的 skip 面 − host-contract×2（S3 半边 + S7 组转实跑）；
#   frozen job 在其上另有 host-version-snapshot×1（选择提示行）+ host-contract×3
#   （S5/S7b agentPresets 分代 skip×2 + S7 7a 未来项注记×1——DSH_BASELINE=frozen 的
#   如实分代语义，非降级）。
# - **独立禁用开关（workflow 层——设计 §6 R3 行「matrix job 可独立禁用」）**：repo
#   variable `R3_BASELINE_MATRIX = 'disabled'` → guard-matrix 整体跳过（guard job 与
#   resolve-baselines 不受影响；矩阵失败不阻塞主门控语义——两 job 互不 fail-fast）。
# - 首跑属 push 后动作（本批只落结构 + 本地等价命令实证：pack 树构造脚本与两基线
#   套件实跑已在本地复演，见 ARCH-005 R3 批交付证据）。
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: 全量门控 node tests/run-all.mjs
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: setup node (LTS)
        uses: actions/setup-node@v4
        with:
          # LTS 锁定：本地实跑基线 v24.x（门控套件仅要求 node ≥ 20——Array.fromAsync /
          # Object.hasOwn 等 API 面）；升级须同步跑一次全量门控确认零回退。
          node-version: '24'
          cache: pnpm

      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: gate (all suites, aggregated exit code)
        run: node tests/run-all.mjs

  # ── ARCH-005 R3：基线 id 集单源解析（matrix 消费——P5：基线数据不复制进 yaml）────
  resolve-baselines:
    name: 基线档案 id 解析（HOST_BASELINE_REGISTRY 单源）
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: extract baseline ids from tests/host-version-snapshot.mjs
        id: ids
        run: |
          IDS=$(node -e '
            const { readFileSync } = require("node:fs")
            const src = readFileSync("tests/host-version-snapshot.mjs", "utf8")
              .replace(/\/\*[\s\S]*?\*\//g, (block) => block.replace(/[^\n]/g, " "))
              .replace(/(^|[^:])\/\/[^\n]*/g, (line) => line.replace(/[^\n]/g, " "))
            const marker = "const HOST_BASELINE_REGISTRY = Object.freeze("
            if (src.indexOf(marker) < 0) { console.error("HOST_BASELINE_REGISTRY marker not found"); process.exit(1) }
            const open = src.indexOf("[", src.indexOf(marker))
            if (open < 0) { console.error("HOST_BASELINE_REGISTRY array literal not found"); process.exit(1) }
            let depth = 0, end = -1
            for (let index = open; index < src.length; index++) {
              if (src[index] === "[") depth += 1
              else if (src[index] === "]") { depth -= 1; if (depth === 0) { end = index; break } }
            }
            const registry = new Function("return " + src.slice(open, end + 1))()
            if (!Array.isArray(registry) || registry.length === 0) { console.error("HOST_BASELINE_REGISTRY unparsable"); process.exit(1) }
            process.stdout.write(JSON.stringify(registry.map((entry) => entry.id)))
          ')
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "resolved baseline ids: $IDS"

  # ── ARCH-005 R3：双基线矩阵门控（pinned 宿主 + DSH_HOST_SOURCE 指向 + 同门控命令）──
  guard-matrix:
    if: ${{ vars.R3_BASELINE_MATRIX != 'disabled' }}
    needs: resolve-baselines
    name: 基线矩阵门控 ${{ matrix.baseline }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        baseline: ${{ fromJSON(needs.resolve-baselines.outputs.ids) }}
    env:
      DSH_BASELINE: ${{ matrix.baseline }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: setup node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # pinned 版本单源解析（P5）：按 DSH_BASELINE 从 HOST_BASELINE_REGISTRY 取
      # dsh / dshPackages 实测值——yaml 内零版本字面量，宿主升级只刷注册表即可。
      - name: resolve pinned host versions from HOST_BASELINE_REGISTRY (single source)
        run: |
          node -e '
            const { readFileSync, appendFileSync } = require("node:fs")
            const src = readFileSync("tests/host-version-snapshot.mjs", "utf8")
              .replace(/\/\*[\s\S]*?\*\//g, (block) => block.replace(/[^\n]/g, " "))
              .replace(/(^|[^:])\/\/[^\n]*/g, (line) => line.replace(/[^\n]/g, " "))
            if (src.indexOf("const HOST_BASELINE_REGISTRY = Object.freeze(") < 0) { console.error("HOST_BASELINE_REGISTRY marker not found"); process.exit(1) }
            const open = src.indexOf("[", src.indexOf("const HOST_BASELINE_REGISTRY = Object.freeze("))
            let depth = 0, end = -1
            for (let index = open; index < src.length; index++) {
              if (src[index] === "[") depth += 1
              else if (src[index] === "]") { depth -= 1; if (depth === 0) { end = index; break } }
            }
            const registry = new Function("return " + src.slice(open, end + 1))()
            const entry = registry.find((item) => item.id === process.env.DSH_BASELINE || item.status === process.env.DSH_BASELINE)
            if (!entry) { console.error("no HOST_BASELINE_REGISTRY entry for DSH_BASELINE=" + process.env.DSH_BASELINE); process.exit(1) }
            appendFileSync(process.env.GITHUB_ENV, "DSH_MAIN_VERSION=" + entry.dsh + "\nDSH_PACKAGES_VERSION=" + entry.dshPackages + "\n")
            console.log("baseline " + entry.id + "(" + entry.status + "): dsh@" + entry.dsh + " dsh-*@" + entry.dshPackages)
          '

      # pinned 宿主树（npm registry 精确版本拉取）：恰好 host-contract 的
      # HOST_KEY_PACKAGES 8 包（形态依据见文件头「树形态」注记——刻意不含
      # dsh-typert-registry / dsh-settings，避免 0.2.0 专属行为判据在旧基线树上报红）。
      - name: pinned host tree (npm pack HOST_KEY_PACKAGES to $RUNNER_TEMP)
        run: |
          set -e
          TREE="$RUNNER_TEMP/host-baseline-tree/@deepseek-ai"
          mkdir -p "$TREE"
          cd "$RUNNER_TEMP"
          for name in dsh-api-remotes dsh-api-session-controller dsh-client-ui-model-selection dsh-client-ui-conversation dsh-llm dsh-client-ui-settings dsh-client-locale; do
            npm pack --silent "@deepseek-ai/$name@${DSH_PACKAGES_VERSION}"
            mkdir -p "$TREE/$name"
            tar -xzf "deepseek-ai-$name-${DSH_PACKAGES_VERSION}.tgz" -C "$TREE/$name" --strip-components=1
          done
          npm pack --silent "@deepseek-ai/dsh@${DSH_MAIN_VERSION}"
          mkdir -p "$TREE/dsh"
          tar -xzf "deepseek-ai-dsh-${DSH_MAIN_VERSION}.tgz" -C "$TREE/dsh" --strip-components=1
          echo "pinned host tree ($DSH_BASELINE) ready:"
          ls "$TREE"

      - name: gate (all suites, aggregated exit code — same entrypoint as guard job)
        env:
          DSH_HOST_SOURCE: ${{ runner.temp }}/host-baseline-tree/@deepseek-ai
